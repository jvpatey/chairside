<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your Chairside account</title>
  </head>
  <body style="margin:0;padding:0;background:#EDF0F5;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#EDF0F5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#FFFFFF;border-radius:20px;overflow:hidden;">
            <tr>
              <td style="padding:36px 32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
                <p style="margin:0 0 28px;font-size:28px;letter-spacing:-0.6px;font-weight:600;">
                  <span style="color:#0E1B2C;">chair</span><span style="color:#1A6FD4;">side</span>
                </p>
                <p style="margin:0 0 8px;font-size:22px;line-height:28px;font-weight:700;color:#0E1B2C;">
                  Confirm your email
                </p>
                <p style="margin:0 0 24px;font-size:16px;line-height:24px;color:#3C485C;">
                  Open this link to finish creating your Chairside account. If you didn’t request this, you can ignore this email.
                </p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1A6FD4;color:#FFFFFF;text-decoration:none;font-size:16px;font-weight:600;padding:14px 22px;border-radius:14px;">
                  Confirm email
                </a>
                <p style="margin:28px 0 0;font-size:13px;line-height:20px;color:#3C485C;">
                  Button not working? Paste this into your browser:<br />
                  <a href="{{ .ConfirmationURL }}" style="color:#1A6FD4;word-break:break-all;">{{ .ConfirmationURL }}</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
